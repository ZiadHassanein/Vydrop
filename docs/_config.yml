title: Vydrop
description: Free open-source Windows downloader for video and audio from YouTube, TikTok, Facebook and 1,000+ sites via yt-dlp. English and Arabic.
url: https://ziadhassanein.github.io
baseurl: /Vydrop
lang: en
# Paste only the content value of the owner's Search Console HTML tag here.
# google_site_verification: "the-owner-provided-content-value"
markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-sitemap
  - jekyll-relative-links
  - jekyll-seo-tag
defaults:
  - scope:
      path: ""
    values:
      layout: default
      lang: en
      dir: ltr
      image:
        path: /assets/social-card.png
        width: 1200
        height: 630
        alt: Vydrop free video and audio downloader for Windows
  - scope:
      path: ar
    values:
      lang: ar
      dir: rtl
exclude:
  - Gemfile
  - Gemfile.lock
