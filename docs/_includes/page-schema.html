<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Person",
      "@id": "https://github.com/ZiadHassanein#person",
      "name": "Ziad Hassanein",
      "url": "https://github.com/ZiadHassanein"
    },
    {
      "@type": "WebSite",
      "@id": "{{ '/' | absolute_url }}#website",
      "url": {{ '/' | absolute_url | jsonify }},
      "name": "Vydrop",
      "inLanguage": ["en", "ar", "en-US", "fr-FR", "de-DE", "es-ES"],
      "publisher": {"@id": "https://github.com/ZiadHassanein#person"}
    },
    {
      "@type": "WebPage",
      "@id": "{{ page.url | absolute_url }}#page",
      "url": {{ page.url | absolute_url | jsonify }},
      "name": {{ page.title | jsonify }},
      "description": {{ page.description | jsonify }},
      "inLanguage": {{ page.language_code | default: page.lang | jsonify }},
      "isPartOf": {"@id": "{{ '/' | absolute_url }}#website"},
      "about": {"@id": "{{ '/' | absolute_url }}#application"},
      "author": {"@id": "https://github.com/ZiadHassanein#person"},
      "isAccessibleForFree": true{% if page.last_reviewed %},
      "dateModified": "{{ page.last_reviewed | date: '%Y-%m-%d' }}"{% endif %}{% unless page.home %},
      "breadcrumb": {"@id": "{{ page.url | absolute_url }}#breadcrumb"}{% endunless %}
    }{% unless page.home %},
    {
      "@type": "BreadcrumbList",
      "@id": "{{ page.url | absolute_url }}#breadcrumb",
      "itemListElement": [
        {"@type": "ListItem", "position": 1, "name": "Vydrop", "item": "{% if page.lang == 'ar' %}{{ '/ar/' | absolute_url }}{% else %}{{ '/' | absolute_url }}{% endif %}"},
        {"@type": "ListItem", "position": 2, "name": {{ page.title | jsonify }}, "item": {{ page.url | absolute_url | jsonify }}}
      ]
    }{% endunless %}
  ]
}
</script>
